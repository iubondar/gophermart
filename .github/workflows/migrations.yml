name: migrations

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  run-migrations:
    runs-on: ubuntu-latest
    container: golang:1.23

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: praktikum
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Run database migrations
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          goose -dir internal/storage/migrations postgres "postgresql://postgres:postgres@postgres/praktikum?sslmode=disable" up 